# ==============================================================================
# Nginx Virtual Host Configuration for storerealtime.xoxod33p.tech (WebSocket / Realtime)
# ==============================================================================

# Realtime Service Upstream (Port 4001)
upstream realtime_upstream {
    server 127.0.0.1:4001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name storerealtime.xoxod33p.tech;

    # Let's Encrypt ACME Challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Realtime / WebSocket proxy configuration
    location / {
        proxy_pass http://realtime_upstream;
        proxy_http_version 1.1;

        # WebSocket support headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client connection metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts for persistent WebSocket connections (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}
