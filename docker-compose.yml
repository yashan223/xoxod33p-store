services:
  mongodb:
    image: mongo:latest
    container_name: xoxod33p-store-mongodb
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-dropzone_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-local}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-xoxod33p-store}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --host localhost --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongodb_data:
    name: xoxod33p-store-mongodb-data
  mongodb_config:
    name: xoxod33p-store-mongodb-config
